<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf3d0" />
      <stop offset="35%" stop-color="#e0a955" />
      <stop offset="70%" stop-color="#b46a36" />
      <stop offset="100%" stop-color="#8a4718" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18332f" />
      <stop offset="100%" stop-color="#0f201d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Luxury Dark Emerald Rounded Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#b46a36" stroke-width="1.5"/>

  <!-- Subtle Inner Border -->
  <rect x="3" y="3" width="58" height="58" rx="13" fill="none" stroke="#e0a955" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Sovereign Hotel Crown Icon -->
  <g filter="url(#glow)">
    <!-- Crown Base Band -->
    <path d="M14 44h36c1 0 1.8.8 1.8 1.8v2.4c0 1-.8 1.8-1.8 1.8H14c-1 0-1.8-.8-1.8-1.8v-2.4c0-1 .8-1.8 1.8-1.8z" fill="url(#goldGrad)"/>
    
    <!-- Crown Band Jewels -->
    <circle cx="20" cy="47" r="1.5" fill="#18332f"/>
    <circle cx="32" cy="47" r="1.8" fill="#ffffff"/>
    <circle cx="44" cy="47" r="1.5" fill="#18332f"/>

    <!-- Crown Spikes / Peaks -->
    <path d="M14 42 L17 25 L26 35 L32 17 L38 35 L47 25 L50 42 Z" fill="url(#goldGrad)"/>

    <!-- Crown Peak Jewels -->
    <circle cx="17" cy="23" r="2.2" fill="#fdf3d0" stroke="#b46a36" stroke-width="0.8"/>
    <circle cx="26" cy="33" r="1.8" fill="#fdf3d0" stroke="#b46a36" stroke-width="0.8"/>
    <circle cx="32" cy="15" r="2.8" fill="#fdf3d0" stroke="#b46a36" stroke-width="1"/>
    <circle cx="38" cy="33" r="1.8" fill="#fdf3d0" stroke="#b46a36" stroke-width="0.8"/>
    <circle cx="47" cy="23" r="2.2" fill="#fdf3d0" stroke="#b46a36" stroke-width="0.8"/>

    <!-- Center Diamond / Sovereign Star -->
    <polygon points="32,26 34.5,31 39.5,31.5 35.5,35 37,40 32,37 27,40 28.5,35 24.5,31.5 29.5,31" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
